# Sicherheits-Header für die Praxis-Website (statisch, ohne externe Dienste).
# In den server{}-Block einbinden: include /etc/nginx/snippets/pfeiler-header.conf;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "DENY" always;
# Hinweis: 'unsafe-inline' für style-src ist nötig wegen weniger Inline-Styles; vor Livegang
# entweder Inline-Styles in neu.css ziehen und den Wert streichen, oder Nonces einführen.
# Das Modus-Skript im <head> ist inline → für script-src 'self' muss es in neu.js wandern
# (dann Blitzen beim Laden vermeiden: Skript synchron im Head als eigene Datei einbinden).
